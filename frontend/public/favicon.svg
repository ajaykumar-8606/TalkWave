<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="twGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#fca639"/>
      <stop offset="50%" stopColor="#f47858"/>
      <stop offset="100%" stopColor="#ea5575"/>
    </linearGradient>
    <linearGradient id="twWave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#ffffff" stopOpacity="0.95"/>
      <stop offset="100%" stopColor="#ffffff" stopOpacity="1"/>
    </linearGradient>
    <filter id="twShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#f47858" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Rounded App Icon Badge -->
  <rect x="4" y="4" width="56" height="56" rx="18" fill="url(#twGrad)" filter="url(#twShadow)"/>

  <!-- Subtle Top Highlight -->
  <path d="M 6 20 C 6 12 12 6 20 6 L 44 6 C 52 6 58 12 58 20 C 58 14 52 8 44 8 L 20 8 C 12 8 6 14 6 20 Z" fill="#ffffff" opacity="0.3"/>

  <!-- Talk Bubble Body -->
  <path d="M 17 21 C 17 17.5 19.8 14.5 23.5 14.5 L 40.5 14.5 C 44.2 14.5 47 17.5 47 21 L 47 34 C 47 37.5 44.2 40.5 40.5 40.5 L 28 40.5 L 20 47.5 L 21.5 40 C 19 39 17 36.5 17 34 Z" fill="#ffffff" fill-opacity="0.22" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Dynamic Sound/Flow Wave inside Talk Bubble -->
  <path d="M 23 27.5 C 25.5 22 28.5 33 31 27.5 C 33.5 22 36.5 33 39 27.5" stroke="url(#twWave)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Real-time Pulse Sync Dot -->
  <circle cx="41" cy="20" r="2.5" fill="#ffffff"/>
</svg>
